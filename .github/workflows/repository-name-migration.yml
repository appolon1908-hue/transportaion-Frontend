name: Repository Name Migration Authority

on:
  pull_request:
    paths:
      - 'repository-name-migration.v1.json'
      - 'REPOSITORY_NAME_MIGRATION.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate_repository_name_migration.py'
      - '.github/workflows/repository-name-migration.yml'
  push:
    branches:
      - main
    paths:
      - 'repository-name-migration.v1.json'
      - 'REPOSITORY_NAME_MIGRATION.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate_repository_name_migration.py'
      - '.github/workflows/repository-name-migration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/validate_repository_name_migration.py
