name: generate-lockfile

on:
  push:
    branches:
      - "fe/release-readiness-v4"

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe/release-readiness-v4
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify locked installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/generate-lockfile.yml
          git commit -m "build: commit reproducible npm lockfile"
          git push origin HEAD:fe/release-readiness-v4
